name = "workshop-gate"
main = "src/index.js"
compatibility_date = "2026-08-01"
preview_urls = false

# KV namespace for people + view events (local dev uses its own local store).
kv_namespaces = [
  { binding = "LOG", id = "0e32c4a8a5f24dfb827210b84668e954" }
]

[vars]
ALLOWED_ORIGINS = "https://maczumby.github.io,http://localhost:8000,http://127.0.0.1:8000"

# STATS_SLUG is NOT set here on purpose — the stats URL must stay out of this
# public repo. Locally it comes from .dev.vars (gitignored); in production set
# it once with: npx wrangler secret put STATS_SLUG
